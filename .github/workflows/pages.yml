name: Deploy to GitHub Pages

# The dashboard is a single static index.html that fetches its data at runtime from
# a Google Apps Script web app. There is no build. We deploy on push (and by hand).
# No schedule: the page only changes on push, and a 15-minute schedule turned every
# GitHub runner hiccup into a "Run failed" email.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-publish
  cancel-in-progress: true   # a newer run replaces a stuck one instead of queueing behind it forever

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages (attempt 1)
        id: deploy1
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Wait before retry
        if: steps.deploy1.outcome == 'failure'
        run: sleep 60
      - name: Deploy to GitHub Pages (final)
        id: deployment
        if: steps.deploy1.outcome == 'failure'
        uses: actions/deploy-pages@v4
