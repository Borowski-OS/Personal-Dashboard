name = "lifeos-aircraft"
main = "aircraft-worker.js"
compatibility_date = "2026-09-01"
workers_dev = true

# Spending counter + short-lived FlightAware answers (so several open screens share one lookup)
[[kv_namespaces]]
binding = "STATE"
id = "e26eb15c70f2439d91a7d440cacb4784"

[vars]
MONTHLY_CAP_USD = "400"  # runaway backstop only; never expected to be reached (the map runs 24/7)
MONTHLY_TARGET_USD = "100"   # soft target: month-to-date spend past this only warns (log + phone ping); nothing stops
AIR_TTL_SEC = "270"      # planes in the air: status + position every 5 min
IDLE_TTL_SEC = "840"     # planes on the ground: status every 15 min

# FlightAware key: set once with `npx wrangler@4 secret put AEROAPI_KEY` (never committed)
