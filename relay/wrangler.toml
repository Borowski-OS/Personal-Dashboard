name = "lifeos-aircraft"
main = "aircraft-worker.js"
compatibility_date = "2026-09-01"
workers_dev = true

# Spending counter + short-lived FlightAware answers (so several open screens share one lookup)
[[kv_namespaces]]
binding = "STATE"
id = "e26eb15c70f2439d91a7d440cacb4784"

[vars]
MONTHLY_CAP_USD = "200"  # HARD runaway backstop only; never expected to be reached (Brad needs it running all the time)
MONTHLY_TARGET_USD = "100"   # planning target: when the projected month passes this the response says warn=true (nothing stops)
AIR_TTL_SEC = "270"      # planes in the air: status + position every 5 min
IDLE_TTL_SEC = "840"     # planes on the ground: status every 15 min
QUIET_START = "23:00"    # overnight quiet window, Pacific: planes on the ground are not checked; planes in the air still are
QUIET_END = "05:00"      # (set both the same to turn it off)
QUIET_TZ = "America/Los_Angeles"

# FlightAware key: set once with `npx wrangler@4 secret put AEROAPI_KEY` (never committed)
